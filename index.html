<body>
<div id="view"></div>

<!-- タイトル: 題字とコースの札（道路の案内標識） -->
<section id="title" class="screen">
  <div class="title-text">
    <h1 class="logo" data-t="logo"></h1>
    <p class="logo-sub" data-t="logoSub"></p>
  </div>
  <div class="title-actions">
    <p class="pick" data-t="pick"></p>
    <div id="courses" class="courses"></div>
    <button id="btnHow" class="chip" data-t="how"></button>
  </div>
  <nav class="foot">
    <button id="btnLang" class="chip" data-t="lang"></button>
    <button id="btnMute" class="chip"></button>
    <a class="chip" href="https://tom3games.com/" data-t="more"></a>
  </nav>
</section>

<!-- 遊び方 -->
<section id="how" class="screen hidden">
  <div class="sheet">
    <h2 data-t="howTitle"></h2>
    <ol id="howList"></ol>
    <p class="keys" id="howKeys"></p>
    <button class="cta small" data-close data-t="ok"></button>
    <p class="credit" data-t="credit"></p>
    <p class="credit"><a href="privacy.html" target="_blank" rel="noopener" style="display:inline-block;padding:12px 16px;margin:-8px 0 -12px">プライバシー / Privacy</a></p>
  </div>
</section>

<!-- 遊び中 -->
<canvas id="speedfx"></canvas><div id="hitflash"></div><div id="redflash"></div><div id="goldflash"></div>
<section id="hud" class="hidden">
  <div id="tags" class="tags"></div>
  <!-- 左上: 計測板（タイム・ベストとの差・ミス） -->
  <div id="board" class="board">
    <b id="clock" class="clock">0.00</b>
    <span class="b-row"><i id="delta" class="delta"></i><i id="miss2" class="miss2"></i></span>
  </div>
  <!-- 右上の下: スコアと連続 -->
  <div id="bounty" class="score">
    <span class="b-label" data-t="scoreL"></span><b id="bVal">0</b>
    <div id="bChain" class="b-chain"><b id="bMult">x1</b><span id="bChainN"></span></div>
  </div>
  <!-- 上の真ん中: 次の輪の方角 -->
  <div id="arrow" class="compass"><svg viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15.5 L4 20Z"/></svg><span id="arrowD"></span><small id="arrowN"></small></div>
  <div id="banner" class="banner hidden"><b id="bannerB"></b></div>
  <div id="say" class="say hidden"></div>
  <div id="near" class="near hidden"><b id="nearTxt"></b><small id="nearN"></small></div>
  <div id="miss" class="miss hidden"><span>×</span><small data-t="tooFar"></small></div>
  <button id="btnPause" class="corner-btn" data-t="pause"></button>
  <div id="touch" class="touch hidden">
    <div id="stickZone" class="stickzone"><div id="stick" class="stick"><div class="knob"></div></div></div>
    <!-- 大ボタン: ワイヤーの射出口。壁蹴りできる時は「蹴る」 -->
    <button class="tbtn tbig" data-k="wire" aria-label="wire"><svg viewBox="0 0 48 48"><path d="M24 30 V44" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M24 30 C24 18 14 18 12 10 M24 30 C24 18 34 18 36 10 M24 30 V8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><path d="M8 13 L12 9 L15 13 M33 13 L36 9 L40 13 M21 9 L24 5 L27 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="kick-l"></span></button>
  </div>
</section>

<!-- 一時停止 -->
<section id="pause" class="screen hidden">
  <div class="sheet narrow">
    <h2 data-t="paused"></h2>
    <button id="btnResume" class="cta small" data-t="resume"></button>
    <button id="btnRetry" class="chip" data-t="retry"></button>
    <button id="btnQuit" class="memo-link" data-t="quit"></button>
  </div>
</section>

<!-- 結果: 計測器の記録紙 -->
<section id="result" class="screen hidden">
  <div class="slip-wrap"><canvas id="slip"></canvas></div>
  <div class="result-actions">
    <button id="btnAgain" class="cta small" data-t="again"></button>
    <button id="btnNext" class="cta small next hidden" data-t="next"></button>
    <div class="chips">
      <button id="btnSave" class="chip" data-t="save"></button>
      <a id="btnPost" class="chip" target="_blank" rel="noopener" data-t="post"></a>
      <button id="btnTitle" class="chip" data-t="toTitle"></button>
    </div>
  </div>
</section>

<!-- ロード画面: 青空のビルのあいだを、ワイヤーで振り子のように飛んでいく人 -->
<div id="boot" class="boot">
  <div class="boot-art" aria-hidden="true">
    <svg class="boot-city" viewBox="0 0 240 150">
      <defs><linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7fd6"/><stop offset="1" stop-color="#cfe2f6"/></linearGradient></defs>
      <rect width="240" height="150" fill="url(#bsky)"/>
      <g fill="#fff" opacity=".85"><ellipse cx="50" cy="30" rx="18" ry="6"/><ellipse cx="170" cy="22" rx="24" ry="7"/></g>
      <path d="M0 150 V70 H30 V150Z M48 150 V96 H70 V150Z M86 150 V60 H112 V150Z M150 150 V84 H176 V150Z M196 150 V52 H222 V150Z" fill="#6f8aa8"/>
      <g fill="#a9c0d8"><rect x="6" y="78" width="4" height="5"/><rect x="16" y="90" width="4" height="5"/><rect x="92" y="70" width="4" height="5"/><rect x="102" y="86" width="4" height="5"/><rect x="202" y="64" width="4" height="5"/><rect x="212" y="80" width="4" height="5"/></g>
      <path d="M118 112 L148 112" stroke="#ff1a2c" stroke-width="2"/>
      <g class="bc-swing"><path d="M112 56 L132 104" stroke="#d8fbff" stroke-width="1.4"/><circle cx="132" cy="106" r="3" fill="#2aa6b8"/></g>
    </svg>
  </div>
  <p class="boot-msg" data-t="loading">コースを準備中</p>
  <div class="boot-bar"><i id="bootBar"></i></div><span id="bootPct" class="boot-pct">0%</span>
</div>
<script>
// ロード画面の進み具合（本体が動き出したら game.js が __bootSet で進める。それまでは少しずつ進める）
(function(){
  var bar=document.getElementById('bootBar'),pct=document.getElementById('bootPct'),k=0,real=false;
  function draw(){bar.style.transform='scaleX('+k.toFixed(3)+')';pct.textContent=Math.round(k*100)+'%'}
  window.__bootSet=function(v){real=true;if(v>k){k=Math.min(1,v);draw()}};
  var t=setInterval(function(){if(real||window.__bootDone){clearInterval(t);return}k=Math.min(0.3,k+0.01);draw()},200);
  draw();
})();
</script>

<script>
// 拡大を止める（ピンチ・ダブルタップ・Ctrl+ホイール）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険: エラーがあって 12 秒たっても準備できていない、または 60 秒たっても準備できていない時に原因を出す（読み込み中は失敗と出さない）
(function(){
  var errs=[];
  window.addEventListener('error',function(e){var tg=e.target;if(tg&&tg!==window&&(tg.src||tg.href))errs.push('load failed: '+(tg.src||tg.href));else errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))},true);
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  function show(){
    if(window.__wdReady||document.getElementById('boot-err')) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  }
  setTimeout(function(){if(errs.length)show()},12000);
  setTimeout(show,60000);
})();
</script>
